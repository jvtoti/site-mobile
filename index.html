<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Meu Feed</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; color: #fff; overflow: hidden;
    overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* O feed ocupa a tela fixa: não muda de tamanho quando a barra do navegador aparece/some */
  #feed { position: fixed; inset: 0; overflow-y: scroll; scroll-snap-type: y mandatory;
    overscroll-behavior: contain; scrollbar-width: none; touch-action: pan-y; }
  #feed::-webkit-scrollbar { display: none; }

  .slide { position: relative; height: 100%; width: 100%; scroll-snap-align: start;
    scroll-snap-stop: always; display: flex; align-items: center; justify-content: center;
    background: #000; overflow: hidden; contain: layout paint style;
    transform: translateZ(0); }
  .slide video { width: 100%; height: 100%; object-fit: contain; display: block;
    pointer-events: none; }
  .slide video.portrait { object-fit: cover; }
  .slide video.player { position: absolute; inset: 0; opacity: 0; }
  .slide video.player.ready { opacity: 1; }
  @media (min-aspect-ratio: 3/4) { .slide video.portrait { object-fit: contain; } }

  .paused-icon { position: absolute; inset: 0; margin: auto; width: 84px; height: 84px;
    opacity: 0; transform: scale(1.4); transition: opacity .18s ease, transform .18s ease;
    pointer-events: none; }
  .slide.paused .paused-icon { opacity: .85; transform: scale(1); }

  .progress { position: absolute; left: 0; right: 0; bottom: env(safe-area-inset-bottom);
    height: 3px; background: rgba(255,255,255,.2); pointer-events: none; }
  .progress > div { height: 100%; width: 100%; background: #fff;
    transform-origin: left center; transform: scaleX(0); will-change: transform; }

  .actions { position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 90px);
    display: flex; flex-direction: column; gap: 18px; z-index: 10; }
  .btn { width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,.45); color: #fff; display: grid; place-items: center;
    transition: transform .1s ease; }
  .btn svg { width: 28px; height: 28px; }
  .btn.add { background: #fe2c55; }
  .btn.on { background: #25f4ee; color: #000; }
  .metro { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bpm { font-size: 12px; font-weight: 700; min-height: 15px; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.7); padding: 0 4px; pointer-events: none; }
  .btn:active { transform: scale(.9); }


  #empty { position: fixed; inset: 0; display: none; flex-direction: column; gap: 18px;
    align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #empty.show { display: flex; }
  #empty h1 { font-size: 22px; }
  #empty p { opacity: .65; max-width: 300px; line-height: 1.4; }
  #empty button { background: #fe2c55; color: #fff; border: 0; border-radius: 8px;
    padding: 14px 28px; font-size: 16px; font-weight: 600; cursor: pointer; }

  /* Red light / green light: borda colorida */
  #light { position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0;
    transition: opacity .25s ease, box-shadow .25s ease; }
  #light.show { opacity: 1; }
  #light.green { box-shadow: inset 0 0 0 6px #22c55e, inset 0 0 80px rgba(34,197,94,.55); }
  #light.red { box-shadow: inset 0 0 0 6px #ef4444, inset 0 0 120px rgba(239,68,68,.75); }
  #light.flash { animation: flash .35s ease-out; }
  @keyframes flash { from { background: rgba(255,255,255,.35); } to { background: transparent; } }

  #toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: rgba(0,0,0,.8); padding: 12px 18px; border-radius: 8px; font-size: 15px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; text-align: center; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="feed"></div>

<div class="actions" id="actions" hidden>
  <button class="btn" id="lightBtn" title="Red light / green light">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="4"/><circle cx="12" cy="7.5" r="2" fill="#ef4444" stroke="none"/><circle cx="12" cy="16.5" r="2" fill="#22c55e" stroke="none"/></svg>
  </button>
  <div class="metro">
    <button class="btn" id="metroBtn" title="Metrônomo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3h5L19 21H5L9.5 3z"/><path d="M12 16 17 6"/><path d="M7.5 16h9"/></svg>
    </button>
    <div class="bpm" id="levelLabel"></div>
  </div>
  <button class="btn" id="muteBtn" title="Som">
    <svg id="muteIcon" viewBox="0 0 24 24" fill="currentColor"></svg>
  </button>
  <button class="btn" id="delBtn" title="Apagar este vídeo">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zm-3 6h12l-1 12H7L6 9zm4 2v8h2v-8h-2zm4 0v8h2v-8h-2z"/></svg>
  </button>
  <button class="btn add" id="addBtn" title="Adicionar vídeos">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
  </button>
</div>

<div id="empty">
  <h1>Seu feed está vazio</h1>
  <p>Adicione vídeos do seu aparelho. Eles ficam salvos só neste navegador e aparecem em ordem aleatória.</p>
  <button id="emptyAddBtn">Adicionar vídeos</button>
</div>

<input type="file" id="fileInput" accept="video/*" multiple hidden>
<div id="light"></div>
<div id="toast"></div>

<script>
(() => {
  // ---------- IndexedDB ----------
  const STORE = 'videos';
  const BEATS = 'beats';   // análises de BPM de versões antigas (só limpeza)
  const dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('meu-feed', 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
      if (!db.objectStoreNames.contains(BEATS)) db.createObjectStore(BEATS, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });

  function run(store, mode, action) {
    return dbPromise.then(db => new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      const req = action(t.objectStore(store));
      t.oncomplete = () => resolve(req && req.result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    }));
  }
  const getAllIds = () => run(STORE, 'readonly', s => s.getAllKeys());
  const getVideo = id => run(STORE, 'readonly', s => s.get(id));
  const putVideo = v => run(STORE, 'readwrite', s => s.put(v));
  const deleteVideo = id => Promise.all([
    run(STORE, 'readwrite', s => s.delete(id)),
    run(BEATS, 'readwrite', s => s.delete(id)),
  ]);

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

  // ---------- Estado ----------
  const feedEl = document.getElementById('feed');
  const emptyEl = document.getElementById('empty');
  const actionsEl = document.getElementById('actions');
  const fileInput = document.getElementById('fileInput');
  const toastEl = document.getElementById('toast');
  const muteIcon = document.getElementById('muteIcon');

  let ids = [];          // todos os vídeos salvos
  let current = null;    // slide visível
  let muted = false;     // preferência: vídeos começam com som
  let swallowTap = false;
  let soundBlocked = false; // navegador bloqueou o som até o primeiro toque na tela
  const KEEP = 2;        // quantos slides vizinhos ficam carregados na memória

  const ICON_MUTED = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4-2.7-2.7z"/>';
  const ICON_SOUND = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>';
  const PLAY_SVG = '<svg class="paused-icon" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function updateMuteIcon() { muteIcon.innerHTML = (muted || soundBlocked) ? ICON_MUTED : ICON_SOUND; }

  const slides = () => feedEl.children;
  const indexOf = slide => Array.prototype.indexOf.call(slides(), slide);

  // ---------- Slides ----------
  function makeSlide(id) {
    const slide = document.createElement('section');
    slide.className = 'slide';
    slide.dataset.id = id;
    slide.innerHTML = '<video playsinline muted preload="auto"></video>' + PLAY_SVG +
                      '<div class="progress"><div></div></div>';
    const video = slide.querySelector('video'); // prévia muda (primeiro quadro)
    slide._video = video;
    slide._bar = slide.querySelector('.progress > div');
    video.addEventListener('loadedmetadata', () => {
      video.classList.toggle('portrait', video.videoHeight >= video.videoWidth);
    });
    slide.addEventListener('click', () => {
      if (slide !== current) return;
      if (swallowTap) { swallowTap = false; return; }
      if (player.paused) { playCurrent(); }
      else { player.pause(); slide.classList.add('paused'); }
    });
    return slide;
  }

  // Dois players com som que se revezam: um toca o vídeo atual e o outro já
  // fica carregado no próximo, pausado no início. Ao terminar, só troca de
  // player e o próximo começa na hora. Depois do primeiro toque o navegador
  // libera o som desses elementos (cada <video> novo nasceria bloqueado).
  function makePlayer() {
    const v = document.createElement('video');
    v.className = 'player';
    v.setAttribute('playsinline', '');
    v.preload = 'auto';
    v.addEventListener('loadedmetadata', () => {
      v.classList.toggle('portrait', v.videoHeight >= v.videoWidth);
    });
    // Só aparece por cima da prévia quando já tem imagem: sem piscar preto
    v.addEventListener('loadeddata', () => v.classList.add('ready'));
    // Terminou: começa o próximo imediatamente
    v.addEventListener('ended', () => {
      if (v === player && current) goTo(indexOf(current) + 1);
    });
    return v;
  }
  let player = makePlayer();   // toca o vídeo atual
  let standby = makePlayer();  // pré-carregado no próximo vídeo

  function mount(v, slide) {
    if (v.parentNode !== slide) {
      v.classList.remove('ready');
      slide.insertBefore(v, slide._video.nextSibling);
    }
    if (v._url !== slide._url) {
      v.classList.remove('ready');
      v._url = slide._url;
      v.src = slide._url;
    }
  }

  function attachPlayer(slide) {
    if (!slide._url) return false;
    // O próximo já está pronto no player reserva: troca os papéis
    if (player._url !== slide._url && standby._url === slide._url) {
      [player, standby] = [standby, player];
      standby.pause();
    }
    mount(player, slide);
    if (player.currentTime > 0.05) player.currentTime = 0;
    preloadNext();
    return true;
  }

  // Deixa o player reserva carregado e com o primeiro quadro pronto no próximo vídeo
  function preloadNext() {
    const next = current && current.nextElementSibling;
    if (!next || !next._url || (standby._url === next._url && standby.parentNode === next)) return;
    const v = standby;
    v.pause();
    mount(v, next);
    v.muted = true;
    const p = v.play();
    if (p) p.then(() => {
      if (v !== player) { v.pause(); v.currentTime = 0; }
    }).catch(() => {});
  }

  // Adiciona mais uma rodada embaralhada ao fim do feed (feed infinito)
  function appendRound() {
    if (!ids.length) return;
    const round = shuffle(ids);
    const last = feedEl.lastElementChild;
    if (last && round.length > 1 && round[0] === last.dataset.id) {
      [round[0], round[1]] = [round[1], round[0]];
    }
    const frag = document.createDocumentFragment();
    for (const id of round) frag.appendChild(makeSlide(id));
    feedEl.appendChild(frag);
  }

  async function load(slide) {
    if (slide._url || slide._loading) return;
    slide._loading = true;
    try {
      const rec = await getVideo(slide.dataset.id);
      if (!rec || !slide.isConnected || slide._url) return;
      slide._url = URL.createObjectURL(rec.blob);
      // #t=0.001 faz o Safari mostrar o primeiro quadro em vez de tela preta
      slide._video.src = slide._url + '#t=0.001';
      prime(slide);
      if (slide === current && attachPlayer(slide)) playCurrent();
      else if (current && slide === current.nextElementSibling) preloadNext();
    } finally {
      slide._loading = false;
    }
  }

  // Deixa o primeiro quadro já desenhado: toca um instante sem som e pausa.
  // Celulares só decodificam a imagem depois do play, por isso a tela preta.
  function prime(slide) {
    const v = slide._video;
    v.muted = true;
    const p = v.play();
    if (p) p.then(() => v.pause()).catch(() => {});
  }

  function unload(slide) {
    if (!slide._url) return;
    for (const v of [player, standby]) {
      if (v._url === slide._url) { v.pause(); v.removeAttribute('src'); v._url = null; }
    }
    const video = slide._video;
    video.pause();
    video.removeAttribute('src');
    video.load();
    URL.revokeObjectURL(slide._url);
    slide._url = null;
    slide._bar.style.transform = 'scaleX(0)';
  }

  function playCurrent() {
    if (!current) return;
    const video = player;
    video.muted = muted || soundBlocked;
    current.classList.remove('paused');
    if (player.parentNode !== current || !video.src) return; // começa quando terminar de carregar
    video.play().catch(() => {
      // Navegador bloqueou o som antes de qualquer toque: toca mudo e
      // liga o som no primeiro toque na tela
      if (!video.muted) {
        soundBlocked = true; updateMuteIcon(); video.muted = true;
        video.play().catch(() => {});
      }
    });
  }

  function unlockSound(e) {
    if (!soundBlocked || (e.target.closest && e.target.closest('#muteBtn'))) return;
    soundBlocked = false;
    updateMuteIcon();
    if (!muted) player.muted = false;
    // play() dentro do toque libera o som dos dois players para os próximos vídeos
    if (current && player.parentNode === current && !current.classList.contains('paused')) {
      player.play().catch(() => {});
    }
    if (standby.src) {
      const v = standby;
      v.play().then(() => { if (v !== player) { v.pause(); v.currentTime = 0; } }).catch(() => {});
    }
    // Esse toque só liga o som: não pausa o vídeo
    if (e.target.closest && e.target.closest('.slide')) {
      swallowTap = true;
      setTimeout(() => { swallowTap = false; }, 600);
    }
  }
  for (const type of ['pointerdown', 'touchend', 'keydown']) {
    document.addEventListener(type, unlockSound, { capture: true });
  }

  function setCurrent(slide) {
    if (!slide || current === slide) return;
    player.pause();
    current = slide;
    const all = slides();
    const idx = indexOf(slide);
    if (idx >= all.length - 3) appendRound();
    for (let i = 0; i < all.length; i++) {
      if (Math.abs(i - idx) <= KEEP) load(all[i]); else unload(all[i]);
    }
    if (attachPlayer(slide)) playCurrent();
  }

  // Rola suavemente até o slide i
  function goTo(i, smooth = true) {
    if (i < 0) return;
    while (i >= slides().length) appendRound();
    const target = slides()[i];
    load(target);
    // Começa o vídeo na hora; a rolagem acompanha
    setCurrent(target);
    feedEl.scrollTo({ top: target.offsetTop, behavior: smooth ? 'smooth' : 'instant' });
  }

  // Só troca de vídeo quando a rolagem termina (evita trocas no meio do gesto)
  function settle() {
    const h = feedEl.clientHeight;
    if (!h) return;
    setCurrent(slides()[Math.round(feedEl.scrollTop / h)]);
  }
  let scrollTimer = null;
  if ('onscrollend' in window) {
    feedEl.addEventListener('scrollend', settle);
  } else {
    feedEl.addEventListener('scroll', () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(settle, 150);
    }, { passive: true });
  }

  // Barra de progresso suave (a cada quadro, só do vídeo atual)
  (function tick() {
    if (current) {
      const v = player;
      if (v.duration && player.parentNode === current) current._bar.style.transform = 'scaleX(' + (v.currentTime / v.duration) + ')';
    }
    requestAnimationFrame(tick);
  })();

  // Mantém o vídeo alinhado quando a tela gira/redimensiona
  window.addEventListener('resize', () => {
    if (current) feedEl.scrollTo({ top: current.offsetTop, behavior: 'instant' });
  });

  // Pausa quando sai do app/aba e retoma ao voltar
  document.addEventListener('visibilitychange', () => {
    if (!current) return;
    if (document.hidden) player.pause();
    else if (!current.classList.contains('paused')) playCurrent();
  });

  function rebuild() {
    for (const v of [player, standby]) { v.pause(); v.removeAttribute('src'); v._url = null; }
    for (const s of [...slides()]) unload(s);
    feedEl.innerHTML = '';
    current = null;
    const hasVideos = ids.length > 0;
    emptyEl.classList.toggle('show', !hasVideos);
    actionsEl.hidden = !hasVideos;
    if (!hasVideos) return;
    appendRound();
    feedEl.scrollTo({ top: 0, behavior: 'instant' });
    setCurrent(slides()[0]);
  }

  // ---------- Metrônomo ----------
  // Clique em níveis de velocidade; a cada 10 s sorteia um nível novo.
  // Fica em silêncio com o vídeo pausado ou na luz vermelha.
  const metroBtn = document.getElementById('metroBtn');
  const levelLabel = document.getElementById('levelLabel');
  // weight = chance de ser sorteado (somam 100)
  const LEVELS = [
    { name: 'Fácil', bpm: 100, weight: 10 },
    { name: 'Médio', bpm: 150, weight: 20 },
    { name: 'Difícil', bpm: 200, weight: 35 },
    { name: 'Expert', bpm: 260, weight: 35 },
  ];
  const LEVEL_SECS = 10;
  const metro = { on: false, ac: null, timer: null, levelTimer: null, level: null, next: null, pending: [] };

  function audioCtx() {
    if (!metro.ac) {
      metro.ac = new (window.AudioContext || window.webkitAudioContext)();
      // iPhone: toca mesmo com a chave de silencioso, como o vídeo
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    }
    if (metro.ac.state === 'suspended') metro.ac.resume();
    return metro.ac;
  }

  function stopClicks() {
    const now = metro.ac ? metro.ac.currentTime : 0;
    for (const o of metro.pending) { try { if (o.t > now) o.osc.stop(); } catch (e) {} }
    metro.pending = [];
    metro.next = null;
  }

  function click(when) {
    const ac = metro.ac;
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = 'square';            // mais encorpado (mais alto) que o seno
    osc.frequency.value = 1000;
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.exponentialRampToValueAtTime(0.8, when + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.07);
    osc.connect(gain).connect(ac.destination);
    osc.start(when);
    osc.stop(when + 0.08);
    metro.pending.push({ osc, t: when });
  }

  // Agenda os cliques dos próximos ~150 ms no ritmo do nível atual
  function scheduleClicks() {
    if (!metro.on || !metro.ac || !metro.level) return;
    if (!current || player.paused || game.phase === 'red') { stopClicks(); return; }
    const ac = metro.ac;
    metro.pending = metro.pending.filter(o => o.t > ac.currentTime - 0.1);
    if (metro.next == null || metro.next < ac.currentTime) metro.next = ac.currentTime + 0.05;
    while (metro.next < ac.currentTime + 0.15) {
      click(metro.next);
      metro.next += 60 / metro.level.bpm; // nível novo vale a partir do próximo clique
    }
  }

  function drawLevel() {
    let r = Math.random() * LEVELS.reduce((sum, l) => sum + l.weight, 0);
    metro.level = LEVELS.find(l => (r -= l.weight) < 0) || LEVELS[LEVELS.length - 1];
    levelLabel.textContent = metro.level.name;
  }

  metroBtn.addEventListener('click', () => {
    metro.on = !metro.on;
    metroBtn.classList.toggle('on', metro.on);
    if (metro.on) {
      audioCtx();
      drawLevel();
      metro.levelTimer = setInterval(drawLevel, LEVEL_SECS * 1000);
      metro.timer = setInterval(scheduleClicks, 25);
    } else {
      clearInterval(metro.timer);
      clearInterval(metro.levelTimer);
      metro.level = null;
      levelLabel.textContent = '';
      stopClicks();
    }
  });

  // ---------- Red light / green light ----------
  // Verde: vai (metrônomo toca). Vermelho: para (metrônomo em silêncio).
  // A cada rodada sorteia a cor (60% verde, 40% vermelho) e depois quanto tempo ela dura;
  // acabou o tempo, sorteia tudo de novo. Aviso sonoro e vibração quando a cor muda.
  const lightBtn = document.getElementById('lightBtn');
  const lightEl = document.getElementById('light');
  const game = { on: false, phase: null, timer: null };
  const GREEN_SECS = [8, 30];   // duração aleatória do verde (s)
  const RED_SECS = [4, 15];     // duração aleatória do vermelho (s)
  const GREEN_CHANCE = 0.6;     // probabilidade de sortear verde

  const rand = ([min, max]) => min + Math.random() * (max - min);

  function cue(phase) {
    const ac = audioCtx();
    const t = ac.currentTime + 0.01;
    // Verde: duas notas subindo. Vermelho: buzina grave.
    const notes = phase === 'green' ? [[660, 0, 0.12], [990, 0.13, 0.18]] : [[220, 0, 0.45]];
    for (const [freq, at, dur] of notes) {
      const osc = ac.createOscillator(), gain = ac.createGain();
      osc.type = phase === 'green' ? 'sine' : 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t + at);
      gain.gain.exponentialRampToValueAtTime(phase === 'green' ? 0.5 : 0.25, t + at + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + at + dur);
      osc.connect(gain).connect(ac.destination);
      osc.start(t + at);
      osc.stop(t + at + dur + 0.02);
    }
    if (navigator.vibrate) navigator.vibrate(phase === 'green' ? [80, 60, 80] : 400);
  }

  function setPhase(phase) {
    game.phase = phase;
    lightEl.className = 'show ' + phase;
    void lightEl.offsetWidth; // reinicia a animação do flash
    lightEl.classList.add('flash');
    if (phase === 'red') stopClicks();
    cue(phase);
  }

  // Uma rodada: sorteia a cor, depois a duração; no fim, nova rodada
  function drawRound() {
    const phase = Math.random() < GREEN_CHANCE ? 'green' : 'red';
    // Se sair a mesma cor, ela só continua (sem aviso)
    if (phase !== game.phase) setPhase(phase);
    clearTimeout(game.timer);
    game.timer = setTimeout(drawRound, rand(phase === 'green' ? GREEN_SECS : RED_SECS) * 1000);
  }

  lightBtn.addEventListener('click', () => {
    game.on = !game.on;
    lightBtn.classList.toggle('on', game.on);
    if (game.on) {
      // Liga o metrônomo junto, se ainda estiver desligado
      if (!metro.on) metroBtn.click();
      game.phase = null;
      drawRound();
    } else {
      clearTimeout(game.timer);
      game.phase = null;
      lightEl.className = '';
    }
  });

  // ---------- Ações ----------
  async function addFiles(files) {
    const list = [...files].filter(f => f.type.startsWith('video/') || /\.(mp4|mov|webm|m4v|mkv)$/i.test(f.name));
    if (!list.length) return;
    toast('Salvando ' + list.length + (list.length === 1 ? ' vídeo…' : ' vídeos…'));
    let ok = 0;
    for (const f of list) {
      try {
        const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        await putVideo({ id, blob: f, name: f.name, added: Date.now() });
        ok++;
      } catch (err) {
        console.error(err);
        toast('Sem espaço para salvar "' + f.name + '"');
        break;
      }
    }
    ids = await getAllIds();
    rebuild();
    if (ok) toast(ok + (ok === 1 ? ' vídeo adicionado' : ' vídeos adicionados'));
  }

  async function deleteCurrent() {
    if (!current) return;
    if (!confirm('Apagar este vídeo do feed?')) return;
    const id = current.dataset.id;
    await deleteVideo(id);
    ids = ids.filter(x => x !== id);
    if (!ids.length) { rebuild(); return; }
    let idx = indexOf(current);
    for (const s of [...slides()]) {
      if (s.dataset.id !== id) continue;
      if (indexOf(s) < idx) idx--;
      unload(s);
      s.remove();
    }
    current = null;
    goTo(idx, false);
    toast('Vídeo apagado');
  }

  const pick = () => fileInput.click();
  document.getElementById('addBtn').addEventListener('click', pick);
  document.getElementById('emptyAddBtn').addEventListener('click', pick);
  fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
  document.getElementById('delBtn').addEventListener('click', deleteCurrent);
  document.getElementById('muteBtn').addEventListener('click', () => {
    if (soundBlocked) { soundBlocked = false; muted = false; } // ícone mostrava mudo: liga o som
    else muted = !muted;
    updateMuteIcon();
    player.muted = muted;
  });

  // Teclado no computador
  document.addEventListener('keydown', e => {
    if (!current) return;
    if (e.key === 'ArrowDown' || e.key === 'j') {
      e.preventDefault(); goTo(indexOf(current) + 1);
    } else if (e.key === 'ArrowUp' || e.key === 'k') {
      e.preventDefault(); goTo(indexOf(current) - 1);
    } else if (e.key === ' ') {
      e.preventDefault(); current.click();
    } else if (e.key === 'm') {
      document.getElementById('muteBtn').click();
    }
  });

  // Arrastar e soltar vídeos no computador
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => { e.preventDefault(); addFiles(e.dataTransfer.files); });

  // ---------- Início ----------
  updateMuteIcon();
  getAllIds().then(list => { ids = list; rebuild(); })
    .catch(err => { console.error(err); toast('Este navegador bloqueou o armazenamento local'); });
})();
</script>
</body>
