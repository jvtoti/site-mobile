<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Meu Feed</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; color: #fff; overflow: hidden;
    overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* O feed ocupa a tela fixa: não muda de tamanho quando a barra do navegador aparece/some */
  #feed { position: fixed; inset: 0; overflow-y: scroll; scroll-snap-type: y mandatory;
    overscroll-behavior: contain; scrollbar-width: none; touch-action: pan-y; }
  #feed::-webkit-scrollbar { display: none; }

  .slide { position: relative; height: 100%; width: 100%; scroll-snap-align: start;
    scroll-snap-stop: always; display: flex; align-items: center; justify-content: center;
    background: #000; overflow: hidden; contain: layout paint style;
    transform: translateZ(0); }
  .slide video { width: 100%; height: 100%; object-fit: contain; display: block;
    pointer-events: none; }
  .slide video.portrait { object-fit: cover; }
  @media (min-aspect-ratio: 3/4) { .slide video.portrait { object-fit: contain; } }

  .paused-icon { position: absolute; inset: 0; margin: auto; width: 84px; height: 84px;
    opacity: 0; transform: scale(1.4); transition: opacity .18s ease, transform .18s ease;
    pointer-events: none; }
  .slide.paused .paused-icon { opacity: .85; transform: scale(1); }

  .progress { position: absolute; left: 0; right: 0; bottom: env(safe-area-inset-bottom);
    height: 3px; background: rgba(255,255,255,.2); pointer-events: none; }
  .progress > div { height: 100%; width: 100%; background: #fff;
    transform-origin: left center; transform: scaleX(0); will-change: transform; }

  .actions { position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 90px);
    display: flex; flex-direction: column; gap: 18px; z-index: 10; }
  .btn { width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,.45); color: #fff; display: grid; place-items: center;
    transition: transform .1s ease; }
  .btn svg { width: 28px; height: 28px; }
  .btn.add { background: #fe2c55; }
  .btn.on { background: #25f4ee; color: #000; }
  .metro { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bpm { font-size: 12px; font-weight: 700; min-height: 15px; border: 0; background: none;
    color: #fff; cursor: pointer; text-shadow: 0 1px 3px rgba(0,0,0,.7); padding: 0 4px; }
  .btn:active { transform: scale(.9); }

  .counter { position: fixed; top: calc(env(safe-area-inset-top) + 14px); left: 0; right: 0;
    text-align: center; font-size: 14px; font-weight: 600; opacity: .7; z-index: 10;
    pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.6); }

  #empty { position: fixed; inset: 0; display: none; flex-direction: column; gap: 18px;
    align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #empty.show { display: flex; }
  #empty h1 { font-size: 22px; }
  #empty p { opacity: .65; max-width: 300px; line-height: 1.4; }
  #empty button { background: #fe2c55; color: #fff; border: 0; border-radius: 8px;
    padding: 14px 28px; font-size: 16px; font-weight: 600; cursor: pointer; }

  /* Red light / green light: borda colorida e aviso no topo */
  #light { position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0;
    transition: opacity .25s ease, box-shadow .25s ease; }
  #light.show { opacity: 1; }
  #light.green { box-shadow: inset 0 0 0 6px #22c55e, inset 0 0 80px rgba(34,197,94,.55); }
  #light.red { box-shadow: inset 0 0 0 6px #ef4444, inset 0 0 120px rgba(239,68,68,.75); }
  #light .badge { position: absolute; top: calc(env(safe-area-inset-top) + 44px); left: 50%;
    transform: translateX(-50%); padding: 8px 18px; border-radius: 999px; font-weight: 800;
    font-size: 18px; letter-spacing: .04em; color: #fff; white-space: nowrap; }
  #light.green .badge { background: #16a34a; }
  #light.red .badge { background: #dc2626; animation: pulse .8s ease-in-out infinite alternate; }
  #light.flash { animation: flash .35s ease-out; }
  @keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.08); } }
  @keyframes flash { from { background: rgba(255,255,255,.35); } to { background: transparent; } }

  #toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: rgba(0,0,0,.8); padding: 12px 18px; border-radius: 8px; font-size: 15px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; text-align: center; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="feed"></div>

<div class="counter" id="counter"></div>

<div class="actions" id="actions" hidden>
  <button class="btn" id="lightBtn" title="Red light / green light">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="4"/><circle cx="12" cy="7.5" r="2" fill="#ef4444" stroke="none"/><circle cx="12" cy="16.5" r="2" fill="#22c55e" stroke="none"/></svg>
  </button>
  <div class="metro">
    <button class="btn" id="metroBtn" title="Metrônomo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3h5L19 21H5L9.5 3z"/><path d="M12 16 17 6"/><path d="M7.5 16h9"/></svg>
    </button>
    <button class="bpm" id="bpmLabel" title="Toque para dobrar ou dividir o BPM"></button>
  </div>
  <button class="btn" id="muteBtn" title="Som">
    <svg id="muteIcon" viewBox="0 0 24 24" fill="currentColor"></svg>
  </button>
  <button class="btn" id="delBtn" title="Apagar este vídeo">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zm-3 6h12l-1 12H7L6 9zm4 2v8h2v-8h-2zm4 0v8h2v-8h-2z"/></svg>
  </button>
  <button class="btn add" id="addBtn" title="Adicionar vídeos">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
  </button>
</div>

<div id="empty">
  <h1>Seu feed está vazio</h1>
  <p>Adicione vídeos do seu aparelho. Eles ficam salvos só neste navegador e aparecem em ordem aleatória.</p>
  <button id="emptyAddBtn">Adicionar vídeos</button>
</div>

<input type="file" id="fileInput" accept="video/*" multiple hidden>
<div id="light"><div class="badge"></div></div>
<div id="toast"></div>

<script>
(() => {
  // ---------- IndexedDB ----------
  const STORE = 'videos';
  const BEATS = 'beats';   // BPM já calculado de cada vídeo
  const dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('meu-feed', 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
      if (!db.objectStoreNames.contains(BEATS)) db.createObjectStore(BEATS, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });

  function run(store, mode, action) {
    return dbPromise.then(db => new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      const req = action(t.objectStore(store));
      t.oncomplete = () => resolve(req && req.result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    }));
  }
  const getAllIds = () => run(STORE, 'readonly', s => s.getAllKeys());
  const getVideo = id => run(STORE, 'readonly', s => s.get(id));
  const putVideo = v => run(STORE, 'readwrite', s => s.put(v));
  const deleteVideo = id => Promise.all([
    run(STORE, 'readwrite', s => s.delete(id)),
    run(BEATS, 'readwrite', s => s.delete(id)),
  ]);
  const getBeat = id => run(BEATS, 'readonly', s => s.get(id));
  const putBeat = b => run(BEATS, 'readwrite', s => s.put(b));

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

  // ---------- Estado ----------
  const feedEl = document.getElementById('feed');
  const counterEl = document.getElementById('counter');
  const emptyEl = document.getElementById('empty');
  const actionsEl = document.getElementById('actions');
  const fileInput = document.getElementById('fileInput');
  const toastEl = document.getElementById('toast');
  const muteIcon = document.getElementById('muteIcon');

  let ids = [];          // todos os vídeos salvos
  let current = null;    // slide visível
  let muted = true;      // navegadores só deixam autoplay sem som até o primeiro toque
  const KEEP = 2;        // quantos slides vizinhos ficam carregados na memória

  const ICON_MUTED = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4-2.7-2.7z"/>';
  const ICON_SOUND = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>';
  const PLAY_SVG = '<svg class="paused-icon" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function updateMuteIcon() { muteIcon.innerHTML = muted ? ICON_MUTED : ICON_SOUND; }

  const slides = () => feedEl.children;
  const indexOf = slide => Array.prototype.indexOf.call(slides(), slide);

  // ---------- Slides ----------
  function makeSlide(id) {
    const slide = document.createElement('section');
    slide.className = 'slide';
    slide.dataset.id = id;
    slide.innerHTML = '<video playsinline muted preload="auto"></video>' + PLAY_SVG +
                      '<div class="progress"><div></div></div>';
    const video = slide.querySelector('video');
    slide._video = video;
    slide._bar = slide.querySelector('.progress > div');
    video.addEventListener('loadedmetadata', () => {
      video.classList.toggle('portrait', video.videoHeight >= video.videoWidth);
    });
    // Terminou: vai para o próximo vídeo
    video.addEventListener('ended', () => {
      if (slide === current) goTo(indexOf(slide) + 1);
    });
    slide.addEventListener('click', () => {
      if (slide !== current) return;
      if (video.paused) { playCurrent(); }
      else { video.pause(); slide.classList.add('paused'); }
    });
    return slide;
  }

  // Adiciona mais uma rodada embaralhada ao fim do feed (feed infinito)
  function appendRound() {
    if (!ids.length) return;
    const round = shuffle(ids);
    const last = feedEl.lastElementChild;
    if (last && round.length > 1 && round[0] === last.dataset.id) {
      [round[0], round[1]] = [round[1], round[0]];
    }
    const frag = document.createDocumentFragment();
    for (const id of round) frag.appendChild(makeSlide(id));
    feedEl.appendChild(frag);
  }

  async function load(slide) {
    if (slide._url || slide._loading) return;
    slide._loading = true;
    try {
      const rec = await getVideo(slide.dataset.id);
      if (!rec || !slide.isConnected || slide._url) return;
      slide._url = URL.createObjectURL(rec.blob);
      slide._video.src = slide._url;
      if (slide === current) playCurrent();
    } finally {
      slide._loading = false;
    }
  }

  function unload(slide) {
    if (!slide._url) return;
    const video = slide._video;
    video.pause();
    video.removeAttribute('src');
    video.load();
    URL.revokeObjectURL(slide._url);
    slide._url = null;
    slide._bar.style.transform = 'scaleX(0)';
  }

  function playCurrent() {
    if (!current) return;
    const video = current._video;
    video.muted = muted;
    current.classList.remove('paused');
    if (!video.src) return; // começa quando terminar de carregar
    video.play().catch(() => {
      // autoplay com som bloqueado: tenta sem som
      if (!video.muted) {
        muted = true; updateMuteIcon(); video.muted = true;
        video.play().catch(() => {});
      }
    });
  }

  function setCurrent(slide) {
    if (!slide || current === slide) return;
    if (current) { current._video.pause(); current._video.muted = true; }
    current = slide;
    const all = slides();
    const idx = indexOf(slide);
    if (idx >= all.length - 3) appendRound();
    for (let i = 0; i < all.length; i++) {
      if (Math.abs(i - idx) <= KEEP) load(all[i]); else unload(all[i]);
    }
    if (slide._video.src) slide._video.currentTime = 0;
    playCurrent();
    metroOnSlide(slide);
    counterEl.textContent = ids.length + (ids.length === 1 ? ' vídeo' : ' vídeos');
  }

  // Rola suavemente até o slide i
  function goTo(i, smooth = true) {
    if (i < 0) return;
    while (i >= slides().length) appendRound();
    const target = slides()[i];
    load(target);
    feedEl.scrollTo({ top: target.offsetTop, behavior: smooth ? 'smooth' : 'instant' });
    if (!smooth) setCurrent(target);
  }

  // Só troca de vídeo quando a rolagem termina (evita trocas no meio do gesto)
  function settle() {
    const h = feedEl.clientHeight;
    if (!h) return;
    setCurrent(slides()[Math.round(feedEl.scrollTop / h)]);
  }
  let scrollTimer = null;
  if ('onscrollend' in window) {
    feedEl.addEventListener('scrollend', settle);
  } else {
    feedEl.addEventListener('scroll', () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(settle, 150);
    }, { passive: true });
  }

  // Barra de progresso suave (a cada quadro, só do vídeo atual)
  (function tick() {
    if (current) {
      const v = current._video;
      if (v.duration) current._bar.style.transform = 'scaleX(' + (v.currentTime / v.duration) + ')';
    }
    requestAnimationFrame(tick);
  })();

  // Mantém o vídeo alinhado quando a tela gira/redimensiona
  window.addEventListener('resize', () => {
    if (current) feedEl.scrollTo({ top: current.offsetTop, behavior: 'instant' });
  });

  // Pausa quando sai do app/aba e retoma ao voltar
  document.addEventListener('visibilitychange', () => {
    if (!current) return;
    if (document.hidden) current._video.pause();
    else if (!current.classList.contains('paused')) playCurrent();
  });

  function rebuild() {
    for (const s of [...slides()]) unload(s);
    feedEl.innerHTML = '';
    current = null;
    const hasVideos = ids.length > 0;
    emptyEl.classList.toggle('show', !hasVideos);
    actionsEl.hidden = !hasVideos;
    counterEl.textContent = '';
    if (!hasVideos) return;
    appendRound();
    feedEl.scrollTo({ top: 0, behavior: 'instant' });
    setCurrent(slides()[0]);
  }

  // ---------- Metrônomo ----------
  // Detecta o BPM do vídeo e toca um clique fixo no tempo da música, sempre com o mesmo som.
  const metroBtn = document.getElementById('metroBtn');
  const bpmLabel = document.getElementById('bpmLabel');
  const metro = { on: false, ac: null, timer: null, nextBeat: null, pending: [] };
  const beatInfo = new Map();   // id -> { bpm, offset, mult, v } | { error, v }
  const beatJobs = new Map();   // id -> Promise da análise em andamento
  const ANALYSIS_VERSION = 3;
  const MAX_ANALYZE_BYTES = 400 * 1024 * 1024;

  function audioCtx() {
    if (!metro.ac) {
      metro.ac = new (window.AudioContext || window.webkitAudioContext)();
      // iPhone: toca mesmo com a chave de silencioso, como o vídeo
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    }
    if (metro.ac.state === 'suspended') metro.ac.resume();
    return metro.ac;
  }

  function decodeAudio(buf) {
    return new Promise((res, rej) => {
      const p = audioCtx().decodeAudioData(buf, res, rej);
      if (p && p.then) p.then(res, rej);
    });
  }

  // Estima o BPM e a posição da primeira batida (em segundos)
  function detectTempo(audio) {
    const sr = audio.sampleRate;
    const len = Math.min(audio.length, Math.floor(sr * 600)); // até 10 min
    const chs = audio.numberOfChannels;
    const mono = new Float32Array(len);
    for (let c = 0; c < chs; c++) {
      const d = audio.getChannelData(c);
      for (let i = 0; i < len; i++) mono[i] += d[i] / chs;
    }

    // Duas faixas: graves (bumbo) e agudos (caixa/chimbal); volume (RMS) em janelas de 30 ms a cada 10 ms
    const hop = Math.round(sr * 0.01);
    const frames = Math.floor(len / hop);
    if (frames < 100) throw new Error('curto');
    const lowS = new Float32Array(frames), highS = new Float32Array(frames);
    const a = Math.exp(-2 * Math.PI * 150 / sr); // passa-baixa ~150 Hz
    let lp = 0, prev = 0;
    for (let f = 0; f < frames; f++) {
      let el = 0, eh = 0;
      for (let i = f * hop, end = i + hop; i < end; i++) {
        const x = mono[i];
        lp = (1 - a) * x + a * lp;
        const hp = x - prev; prev = x;
        el += lp * lp; eh += hp * hp;
      }
      lowS[f] = el; highS[f] = eh;
    }
    const lowE = new Float32Array(frames), highE = new Float32Array(frames);
    for (let f = 0; f < frames; f++) {
      const g0 = Math.max(0, f - 1), g1 = Math.min(frames - 1, f + 1);
      let sl = 0, sh = 0;
      for (let g = g0; g <= g1; g++) { sl += lowS[g]; sh += highS[g]; }
      lowE[f] = Math.sqrt(sl); highE[f] = Math.sqrt(sh);
    }

    // Força dos ataques: aumento de energia em cada faixa, normalizado e sem a média local
    function onsets(e) {
      const flux = new Float32Array(frames);
      let max = 0;
      for (let f = 1; f < frames; f++) { flux[f] = Math.max(0, e[f] - e[f - 1]); max = Math.max(max, flux[f]); }
      if (max > 0) for (let f = 0; f < frames; f++) flux[f] /= max;
      const W = 25, out = new Float32Array(frames); // ~0,5 s para cada lado
      let acc = 0;
      for (let f = 0; f < frames + W; f++) {
        if (f < frames) acc += flux[f];
        if (f - 2 * W - 1 >= 0) acc -= flux[f - 2 * W - 1];
        const c = f - W;
        if (c >= 0) {
          const n = Math.min(f, frames - 1) - Math.max(0, c - W) + 1;
          out[c] = Math.max(0, flux[c] - acc / n);
        }
      }
      return out;
    }
    const lowO = onsets(lowE), highO = onsets(highE);
    // Bumbo marca o tempo; agudos ajudam, mas costumam cair no contratempo
    const onset = new Float32Array(frames), beatO = new Float32Array(frames);
    for (let f = 0; f < frames; f++) beatO[f] = lowO[f] + 0.2 * highO[f];
    // Espalha cada pico por ±2 quadros: tempos que não caem em múltiplos de 10 ms não se perdem
    const K = [1, 2, 3, 2, 1];
    for (let f = 0; f < frames; f++) {
      let v = 0;
      for (let j = -2; j <= 2; j++) {
        const g = f + j;
        if (g >= 0 && g < frames) v += K[j + 2] * (lowO[g] + 0.6 * highO[g]);
      }
      onset[f] = v / 9;
    }

    // Autocorrelação nas defasagens de 50 a 220 BPM, preferindo perto de 120
    const minL = Math.floor(6000 / 220), maxL = Math.ceil(6000 / 50);
    const ac = new Float32Array(2 * maxL + 2);
    for (let L = 1; L < ac.length && L < frames; L++) {
      let sum = 0;
      for (let f = 0; f + L < frames; f++) sum += onset[f] * onset[f + L];
      ac[L] = sum / (frames - L);
    }
    let best = minL, bestScore = -Infinity;
    for (let L = minL; L <= maxL; L++) {
      const bpm = 6000 / L;
      const prior = Math.exp(-0.5 * Math.pow(Math.log2(bpm / 120) / 0.9, 2));
      const score = (ac[L] + 0.5 * (ac[2 * L] || 0)) * prior;
      if (score > bestScore) { bestScore = score; best = L; }
    }
    if (!(bestScore > 0)) throw new Error('sem ritmo');
    // Refina período e fase juntos: a grade de batidas que mais coincide com os ataques
    const beatS = new Float32Array(frames);
    for (let f = 0; f < frames; f++) {
      let v = 0;
      for (let j = -2; j <= 2; j++) {
        const g = f + j;
        if (g >= 0 && g < frames) v += K[j + 2] * beatO[g];
      }
      beatS[f] = v / 9;
    }
    const at = t => { const i = Math.floor(t), r = t - i; return (beatS[i] || 0) * (1 - r) + (beatS[i + 1] || 0) * r; };
    let period = best, phase = 0, bestSum = -1;
    for (let P = best - 1.5; P <= best + 1.5; P += 0.02) {
      for (let ph = 0; ph < P; ph += 0.5) {
        let sum = 0, n = 0;
        for (let t = ph; t < frames - 1; t += P) { sum += at(t); n++; }
        sum /= n;
        if (sum > bestSum) { bestSum = sum; period = P; phase = ph; }
      }
    }
    // +1 quadro: o ataque é detectado no início do quadro de 10 ms
    return { bpm: 6000 / period, offset: (phase + 1) * hop / sr };
  }

  function analyze(id) {
    if (beatInfo.has(id)) return Promise.resolve(beatInfo.get(id));
    if (beatJobs.has(id)) return beatJobs.get(id);
    const job = (async () => {
      let info = await getBeat(id).catch(() => null);
      if (info && info.v !== ANALYSIS_VERSION) info = null; // análise de versão antiga: refaz
      if (!info) {
        try {
          const rec = await getVideo(id);
          if (!rec) throw new Error('apagado');
          if (rec.blob.size > MAX_ANALYZE_BYTES) throw new Error('grande');
          const audio = await decodeAudio(await rec.blob.arrayBuffer());
          info = { id, v: ANALYSIS_VERSION, ...detectTempo(audio), mult: 1 };
          putBeat(info).catch(() => {});
        } catch (err) {
          console.warn('BPM:', err);
          info = { id, v: ANALYSIS_VERSION, error: true };
        }
      }
      beatInfo.set(id, info);
      beatJobs.delete(id);
      updateBpmLabel();
      return info;
    })();
    beatJobs.set(id, job);
    return job;
  }

  function updateBpmLabel() {
    if (!metro.on || !current) { bpmLabel.textContent = ''; return; }
    const info = beatInfo.get(current.dataset.id);
    if (!info) bpmLabel.textContent = '…';
    else if (info.error) bpmLabel.textContent = 'sem ritmo';
    else bpmLabel.textContent = Math.round(info.bpm * info.mult) + ' BPM';
  }

  function stopClicks() {
    const now = metro.ac ? metro.ac.currentTime : 0;
    for (const o of metro.pending) { try { if (o.t > now) o.osc.stop(); } catch (e) {} }
    metro.pending = [];
    metro.nextBeat = null;
  }

  function click(when) {
    const ac = metro.ac;
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.frequency.value = 1200;
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.exponentialRampToValueAtTime(0.7, when + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.06);
    osc.connect(gain).connect(ac.destination);
    osc.start(when);
    osc.stop(when + 0.07);
    metro.pending.push({ osc, t: when });
  }

  // Agenda os cliques dos próximos ~150 ms na grade fixa do BPM, com base no tempo do vídeo
  function scheduleClicks() {
    if (!metro.on || !current || !metro.ac) return;
    const v = current._video;
    const info = beatInfo.get(current.dataset.id);
    if (!info || info.error || v.paused || v.seeking || v.readyState < 3 || game.phase === 'red') { stopClicks(); return; }
    const ac = metro.ac;
    metro.pending = metro.pending.filter(o => o.t > ac.currentTime - 0.1);
    const period = 60 / (info.bpm * info.mult);
    const now = v.currentTime, rate = v.playbackRate || 1;
    const first = Math.ceil((now - info.offset) / period - 1e-6);
    let k = metro.nextBeat;
    if (k == null || k < first - 1 || k > first + 2) k = first; // pulou/voltou: ressincroniza
    for (;;) {
      const t = info.offset + k * period;
      if (t > now + 0.15) break;
      const when = ac.currentTime + (t - now) / rate;
      if (when >= ac.currentTime - 0.005) click(Math.max(when, ac.currentTime));
      k++;
    }
    metro.nextBeat = k;
  }

  // Ao trocar de vídeo: zera os cliques e analisa este e o próximo
  function metroOnSlide(slide) {
    stopClicks();
    updateBpmLabel();
    if (!metro.on || !slide) return;
    analyze(slide.dataset.id).then(() => {
      const next = slide.nextElementSibling;
      if (metro.on && next) analyze(next.dataset.id);
    });
  }

  metroBtn.addEventListener('click', () => {
    metro.on = !metro.on;
    metroBtn.classList.toggle('on', metro.on);
    if (metro.on) {
      audioCtx();
      metro.timer = setInterval(scheduleClicks, 25);
      metroOnSlide(current);
    } else {
      clearInterval(metro.timer);
      stopClicks();
      updateBpmLabel();
    }
  });

  // Corrige quando o BPM sai pela metade ou em dobro: 1× → 2× → ½× → 1×
  bpmLabel.addEventListener('click', () => {
    if (!current) return;
    const info = beatInfo.get(current.dataset.id);
    if (!info || info.error) return;
    info.mult = info.mult === 1 ? 2 : info.mult === 2 ? 0.5 : 1;
    putBeat(info).catch(() => {});
    stopClicks();
    updateBpmLabel();
  });

  // ---------- Red light / green light ----------
  // Verde: vai (metrônomo toca). Vermelho: para (metrônomo em silêncio).
  // A troca acontece em tempos aleatórios, com aviso sonoro e vibração.
  const lightBtn = document.getElementById('lightBtn');
  const lightEl = document.getElementById('light');
  const lightBadge = lightEl.querySelector('.badge');
  const game = { on: false, phase: null, timer: null };
  const GREEN_SECS = [8, 30];   // duração aleatória do verde (s)
  const RED_SECS = [4, 15];     // duração aleatória do vermelho (s)

  const rand = ([min, max]) => min + Math.random() * (max - min);

  function cue(phase) {
    const ac = audioCtx();
    const t = ac.currentTime + 0.01;
    // Verde: duas notas subindo. Vermelho: buzina grave.
    const notes = phase === 'green' ? [[660, 0, 0.12], [990, 0.13, 0.18]] : [[220, 0, 0.45]];
    for (const [freq, at, dur] of notes) {
      const osc = ac.createOscillator(), gain = ac.createGain();
      osc.type = phase === 'green' ? 'sine' : 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t + at);
      gain.gain.exponentialRampToValueAtTime(phase === 'green' ? 0.5 : 0.25, t + at + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + at + dur);
      osc.connect(gain).connect(ac.destination);
      osc.start(t + at);
      osc.stop(t + at + dur + 0.02);
    }
    if (navigator.vibrate) navigator.vibrate(phase === 'green' ? [80, 60, 80] : 400);
  }

  function setPhase(phase) {
    game.phase = phase;
    lightEl.className = 'show ' + phase;
    void lightEl.offsetWidth; // reinicia a animação do flash
    lightEl.classList.add('flash');
    lightBadge.textContent = phase === 'green' ? 'LUZ VERDE · VAI' : 'LUZ VERMELHA · PARA';
    if (phase === 'red') stopClicks();
    cue(phase);
    clearTimeout(game.timer);
    game.timer = setTimeout(() => setPhase(phase === 'green' ? 'red' : 'green'),
                            rand(phase === 'green' ? GREEN_SECS : RED_SECS) * 1000);
  }

  lightBtn.addEventListener('click', () => {
    game.on = !game.on;
    lightBtn.classList.toggle('on', game.on);
    if (game.on) {
      // Liga o metrônomo junto, se ainda estiver desligado
      if (!metro.on) metroBtn.click();
      setPhase('green');
    } else {
      clearTimeout(game.timer);
      game.phase = null;
      lightEl.className = '';
    }
  });

  // ---------- Ações ----------
  async function addFiles(files) {
    const list = [...files].filter(f => f.type.startsWith('video/') || /\.(mp4|mov|webm|m4v|mkv)$/i.test(f.name));
    if (!list.length) return;
    toast('Salvando ' + list.length + (list.length === 1 ? ' vídeo…' : ' vídeos…'));
    let ok = 0;
    for (const f of list) {
      try {
        const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        await putVideo({ id, blob: f, name: f.name, added: Date.now() });
        ok++;
      } catch (err) {
        console.error(err);
        toast('Sem espaço para salvar "' + f.name + '"');
        break;
      }
    }
    ids = await getAllIds();
    rebuild();
    if (ok) toast(ok + (ok === 1 ? ' vídeo adicionado' : ' vídeos adicionados'));
  }

  async function deleteCurrent() {
    if (!current) return;
    if (!confirm('Apagar este vídeo do feed?')) return;
    const id = current.dataset.id;
    await deleteVideo(id);
    beatInfo.delete(id);
    ids = ids.filter(x => x !== id);
    if (!ids.length) { rebuild(); return; }
    let idx = indexOf(current);
    for (const s of [...slides()]) {
      if (s.dataset.id !== id) continue;
      if (indexOf(s) < idx) idx--;
      unload(s);
      s.remove();
    }
    current = null;
    goTo(idx, false);
    toast('Vídeo apagado');
  }

  const pick = () => fileInput.click();
  document.getElementById('addBtn').addEventListener('click', pick);
  document.getElementById('emptyAddBtn').addEventListener('click', pick);
  fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
  document.getElementById('delBtn').addEventListener('click', deleteCurrent);
  document.getElementById('muteBtn').addEventListener('click', () => {
    muted = !muted;
    updateMuteIcon();
    if (current) current._video.muted = muted;
  });

  // Teclado no computador
  document.addEventListener('keydown', e => {
    if (!current) return;
    if (e.key === 'ArrowDown' || e.key === 'j') {
      e.preventDefault(); goTo(indexOf(current) + 1);
    } else if (e.key === 'ArrowUp' || e.key === 'k') {
      e.preventDefault(); goTo(indexOf(current) - 1);
    } else if (e.key === ' ') {
      e.preventDefault(); current.click();
    } else if (e.key === 'm') {
      document.getElementById('muteBtn').click();
    }
  });

  // Arrastar e soltar vídeos no computador
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => { e.preventDefault(); addFiles(e.dataTransfer.files); });

  // ---------- Início ----------
  updateMuteIcon();
  getAllIds().then(list => { ids = list; rebuild(); })
    .catch(err => { console.error(err); toast('Este navegador bloqueou o armazenamento local'); });
})();
</script>
</body>
</html>
